# Optional project MCP configuration. Disabled by default.
# For a checkout-specific registration, run scripts/register-codex.ps1.
# To use this file, activate this checkout's virtual environment and start
# the host from the repository root so these relative paths resolve here.
[mcp_servers.cairn-ctf]
enabled = false
command = "python"
args = ["-m", "cairn.codex_mcp", "--config", "dispatch.codex.yaml", "--db-path", "data/cairn.db", "--port", "8792"]
startup_timeout_sec = 45
tool_timeout_sec = 1800
